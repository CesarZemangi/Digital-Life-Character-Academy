<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Digital Life Academy</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="supabase-config.js"></script>
</head>
<body class="auth-body">
    <div class="auth-scene">
        <div class="auth-card">
            <div class="auth-badge">❤</div>
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to continue your journey</p>
            </div>

            <div class="auth-avatar-wrap">
                <div class="auth-avatar">
                    <span>😊</span>
                </div>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="field-wrap">
                    <span class="field-icon">✉</span>
                    <input id="loginEmail" type="email" placeholder="Email or Username" required />
                </div>

                <div class="field-wrap">
                    <span class="field-icon">🔒</span>
                    <input id="loginPassword" type="password" placeholder="Password" required />
                    <button type="button" class="field-eye" data-toggle-password="loginPassword" aria-label="Show password">👁</button>
                </div>

                <div class="auth-meta">
                    <a href="#" id="forgotPasswordLink">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-btn primary">Login</button>
            </form>

            <p class="auth-switch">
                Don't have an account? <a href="register.html">Sign Up</a>
            </p>
        </div>
    </div>

    <script>
        const defaultAdmin = {
            id: 'admin-1',
            fullName: 'System Administrator',
            username: 'admin',
            email: 'ujikacaesar@gmail.com',
            password: '5699',
            role: 'admin'
        };

        const savedUsers = JSON.parse(localStorage.getItem('digitalAcademyUsers') || '[]');
        if (!savedUsers.some((user) => user.email === defaultAdmin.email)) {
            savedUsers.push(defaultAdmin);
            localStorage.setItem('digitalAcademyUsers', JSON.stringify(savedUsers));
        }

        const supabaseManager = window.DigitalAcademySupabase;
        const supabaseClient = supabaseManager && supabaseManager.getSupabaseClient ? supabaseManager.getSupabaseClient() : null;

        const loginForm = document.getElementById('loginForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');

        document.querySelectorAll('[data-toggle-password]').forEach((toggle) => {
            toggle.addEventListener('click', () => {
                const input = document.getElementById(toggle.dataset.togglePassword);
                if (!input) return;

                const shouldShow = input.type === 'password';
                input.type = shouldShow ? 'text' : 'password';
                toggle.textContent = shouldShow ? '🙈' : '👁';
                toggle.setAttribute('aria-label', shouldShow ? 'Hide password' : 'Show password');
            });
        });

        const demoUsers = JSON.parse(localStorage.getItem('digitalAcademyUsers') || '[]');

        document.getElementById('forgotPasswordLink').addEventListener('click', (event) => {
            event.preventDefault();

            const emailInput = window.prompt('Enter your email or username to reset your password:', loginEmail.value.trim() || '');
            if (!emailInput) {
                return;
            }

            const matchedUser = demoUsers.find((user) => {
                const emailMatches = user.email.toLowerCase() === emailInput.toLowerCase();
                const usernameMatches = user.username.toLowerCase() === emailInput.toLowerCase();
                return emailMatches || usernameMatches;
            });

            if (!matchedUser) {
                alert('No account was found for that email or username. Please register first.');
                return;
            }

            const newPassword = window.prompt('Create a new password (minimum 4 characters):', '');
            if (!newPassword || newPassword.trim().length < 4) {
                alert('A valid password with at least 4 characters is required.');
                return;
            }

            matchedUser.password = newPassword.trim();
            localStorage.setItem('digitalAcademyUsers', JSON.stringify(demoUsers));
            loginEmail.value = matchedUser.email;
            alert('Password reset successful. You can now log in with your new password.');
        });

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = loginEmail.value.trim();
            const password = loginPassword.value.trim();

            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }

            if (supabaseClient && !supabaseManager.isPlaceholder) {
                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) {
                        throw error;
                    }

                    const sessionData = {
                        email: data.user?.email || email,
                        username: (data.user?.user_metadata?.username || data.user?.email || 'Learner').split('@')[0],
                        role: data.user?.user_metadata?.role || 'user',
                        provider: 'supabase'
                    };

                    localStorage.setItem('digitalAcademySession', JSON.stringify(sessionData));
                    window.location.href = 'index.html';
                    return;
                } catch (error) {
                    alert(error?.message || 'Unable to sign in with Supabase. Please check your credentials.');
                    return;
                }
            }

            const matchedUser = demoUsers.find((user) => {
                const emailMatches = user.email.toLowerCase() === email.toLowerCase();
                const usernameMatches = user.username.toLowerCase() === email.toLowerCase();
                return (emailMatches || usernameMatches) && user.password === password;
            });

            if (!matchedUser) {
                alert('No matching account found. Please register first or check your login details.');
                return;
            }

            const session = {
                email: matchedUser.email,
                username: matchedUser.username,
                role: matchedUser.role || 'user',
                needsPasswordChange: matchedUser.email === 'ujikacaesar@gmail.com' && matchedUser.password === '5699'
            };

            localStorage.setItem('digitalAcademySession', JSON.stringify(session));

            if (session.needsPasswordChange) {
                const newPassword = window.prompt('Default admin password detected. Please create a new password before continuing:', '');
                if (!newPassword || newPassword.trim().length < 4) {
                    alert('A new password is required before the admin account can continue.');
                    return;
                }

                const updatedUsers = JSON.parse(localStorage.getItem('digitalAcademyUsers') || '[]');
                const targetUser = updatedUsers.find((user) => user.email === 'ujikacaesar@gmail.com');
                if (targetUser) {
                    targetUser.password = newPassword.trim();
                    localStorage.setItem('digitalAcademyUsers', JSON.stringify(updatedUsers));
                }

                localStorage.setItem('digitalAcademySession', JSON.stringify({
                    email: matchedUser.email,
                    username: matchedUser.username,
                    role: matchedUser.role || 'user',
                    needsPasswordChange: false
                }));

                alert('Password updated successfully. Welcome back.');
            }

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
